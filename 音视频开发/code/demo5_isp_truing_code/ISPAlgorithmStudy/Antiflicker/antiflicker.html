<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Anti-Flicker Explained - 3B1B Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Latin+Modern+Math&family=Noto+Sans+SC:wght@300;500&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0; /* 3B1B Light Background */
            font-family: 'Latin Modern Math', 'Noto Sans SC', serif;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: #ffffff;
        }

        #subtitle-box {
            position: absolute;
            bottom: 8%;
            width: 80%;
            text-align: center;
            color: #333;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .en-sub {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #222;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
        }

        .cn-sub {
            font-size: 1.4rem;
            font-weight: 300;
            color: #555;
            background: rgba(255,255,255,0.85);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
    <div id="subtitle-box">
        <div class="en-sub" id="sub-en"></div>
        <div class="cn-sub" id="sub-cn"></div>
    </div>
</div>

<script>
/**
 * 3B1B Style Animation Engine
 * Specialized for explaining Camera Anti-Banding
 */

// --- Configuration & Colors ---
const COLORS = {
    bg: "#ffffff",
    text: "#333333",
    grid: "#e0e0e0",
    blue: "#118ab2", // Teal/Blue for sensor
    red: "#ef476f",  // Red for light wave
    yellow: "#ffd166", // Gold for highlight/window
    green: "#06d6a0", // Success
    dark: "#073b4c"
};

// --- Setup Canvas ---
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
let width, height;

// High DPI handling
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
window.addEventListener('resize', resize);
resize();

// --- Animation State ---
const state = {
    startTime: null,
    time: 0, // Current video time in seconds
    sceneIndex: 0
};

// --- Utils ---
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOutCubic(t) { return t < .5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1; }
function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }
function mapRange(value, low1, high1, low2, high2) { return low2 + (high2 - low2) * (value - low1) / (high1 - low1); }

// --- Subtitles Script ---
const script = [
    { start: 0, dur: 4, en: "Have you ever seen these annoying bands on your phone screen?", cn: "你是否在手机屏幕上见过这些恼人的条纹？" },
    { start: 4, dur: 5, en: "This is the 'Flicker' phenomenon. But where does it come from?", cn: "这就是‘频闪’现象。但它究竟从何而来？" },
    { start: 9, dur: 6, en: "Indoor lights are powered by AC electricity, oscillating at 50Hz or 60Hz.", cn: "室内灯光由交流电供电，以50Hz或60Hz的频率振荡。" },
    { start: 15, dur: 5, en: "This means the brightness actually pulses 100 times per second.", cn: "这意味着亮度实际上每秒脉冲100次。" },
    { start: 20, dur: 6, en: "Cameras use a 'Rolling Shutter'. They read the image row by row, over time.", cn: "相机使用‘卷帘快门’。它们随时间推移逐行读取图像。" },
    { start: 26, dur: 7, en: "If the exposure time doesn't align with the light cycle, some rows get more light, some less.", cn: "如果曝光时间与光周期不对齐，有的行进光多，有的少。" },
    { start: 33, dur: 5, en: "Mathematically, the brightness is the integral of the wave over the exposure time.", cn: "从数学上讲，亮度是光波在曝光时间内的积分。" },
    { start: 38, dur: 6, en: "If we set the exposure time to exactly one full light cycle...", cn: "如果我们把曝光时间设定为正好一个完整的光周期……" },
    { start: 44, dur: 5, en: "The total light energy collected becomes constant, regardless of when we start.", cn: "无论何时开始曝光，收集的总光能都变得恒定。" },
    { start: 49, dur: 5, en: "This is Anti-Banding. Physics and Math working together.", cn: "这就是抗频闪功能。物理与数学的完美结合。" }
];

// --- Drawing Functions ---

// 1. Draw Grid Background
function drawGrid() {
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    const step = 100;
    
    // Moving grid effect
    const offset = (state.time * 20) % step;

    ctx.beginPath();
    for (let x = -offset; x < width; x += step) {
        ctx.moveTo(x, 0); ctx.lineTo(x, height);
    }
    for (let y = -offset; y < height; y += step) {
        ctx.moveTo(0, y); ctx.lineTo(width, y);
    }
    ctx.stroke();
}

// 2. Draw Sine Wave (The Light)
// x, y: position, w: width, amp: amplitude, freq: frequency, phase: phase shift
function drawLightWave(x, y, w, amp, freq, phase, opacity = 1) {
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.beginPath();
    ctx.lineWidth = 3;
    ctx.strokeStyle = COLORS.red;
    
    // Draw Axis
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.stroke();

    // Draw Wave (Intensity = sin^2 or abs(sin), but visually a simple offset sin looks best for explanation)
    // We simulate Light Intensity: Range [0, 1]
    ctx.beginPath();
    ctx.strokeStyle = COLORS.red;
    ctx.lineWidth = 4;
    
    for (let i = 0; i < w; i++) {
        // Light intensity formula: I = A * (sin(wt) + 1) / 2
        const t = (i / w) * freq * Math.PI * 2 + phase;
        const val = (Math.sin(t) + 1) / 2; // 0 to 1
        const py = y - val * amp;
        
        if (i === 0) ctx.moveTo(x + i, py);
        else ctx.lineTo(x + i, py);
    }
    ctx.stroke();

    // Label
    ctx.fillStyle = COLORS.text;
    ctx.font = "20px 'Latin Modern Math'";
    ctx.fillText("Light Intensity (AC)", x, y + 30);
    ctx.restore();
}

// 3. Draw Camera Sensor / Photo
function drawSensorView(x, y, w, h, time, exposureDuration, showBanding) {
    ctx.save();
    
    // Frame
    ctx.strokeStyle = COLORS.text;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    
    // Mask for content
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();

    // Draw Rows
    const rows = 30; // Number of sensor rows visualization
    const rowH = h / rows;
    
    // Physics constants for simulation
    const lightFreq = 4; // Visual frequency
    const scanSpeed = 1; // Visual scan speed
    
    for (let i = 0; i < rows; i++) {
        const rowY = y + i * rowH;
        
        // The time this specific row is exposed
        // Rolling shutter: Top row is t=0, bottom row is t=latet
        const rowTimeStart = time + (i / rows) * scanSpeed; 
        
        let brightness = 0.8; // Default grey

        if (showBanding) {
            // INTEGRAL CALCULATION VISUALIZED
            // Brightness = Integral of Light(t) from rowTimeStart to rowTimeStart + exposureDuration
            // Light(t) = (sin(t*freq) + 1) / 2
            
            // Approximate integral by sampling
            let sum = 0;
            const samples = 20;
            for(let s=0; s<samples; s++) {
                const t = rowTimeStart + (s/samples) * exposureDuration;
                const lightVal = (Math.sin(t * lightFreq * Math.PI * 2) + 1) / 2;
                sum += lightVal;
            }
            const avg = sum / samples;
            
            // Map avg (0-1) to visual brightness
            // If exposure is short and un-synced, avg varies wildly based on phase
            // If exposure is 1/freq, avg is constant
            brightness = 0.2 + avg * 0.8;
        }

        ctx.fillStyle = `rgba(0,0,0, ${1 - brightness})`; // Darker = less light
        ctx.fillRect(x, rowY, w, rowH + 1); // +1 to fix gaps
    }
    
    // Draw "Scan Line" indicator
    const scanY = (time * 100) % (h + 50);
    if (scanY < h) {
        ctx.strokeStyle = COLORS.blue;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - 10, y + scanY);
        ctx.lineTo(x + w + 10, y + scanY);
        ctx.stroke();
        
        ctx.fillStyle = COLORS.blue;
        ctx.font = "14px 'Noto Sans SC'";
        ctx.fillText("Rolling Shutter Scan", x + w + 15, y + scanY + 5);
    }
    
    ctx.restore();
}

// 4. The Mathematical Window (Integration)
function drawIntegralVis(cx, cy, radius, time, exposureLength, synced) {
    ctx.save();
    ctx.translate(cx, cy);

    // Draw Wave
    const waveW = 400;
    const waveH = 80;
    const startX = -waveW/2;
    
    // Draw the static wave
    ctx.beginPath();
    ctx.strokeStyle = "#ccc";
    ctx.lineWidth = 2;
    const freq = 4;
    for (let i = 0; i < waveW; i++) {
        const t = (i / 100); 
        const val = (Math.sin(t * freq) + 1) / 2;
        const py = (1 - val) * waveH - waveH/2;
        if (i===0) ctx.moveTo(startX + i, py);
        else ctx.lineTo(startX + i, py);
    }
    ctx.stroke();

    // Draw the Sliding Window (Exposure Time)
    // The window moves across the wave
    const windowPos = (time * 50) % (waveW - 100);
    const windowW = exposureLength * 100; // Map time to pixels
    
    // Highlight area under curve inside window
    ctx.beginPath();
    ctx.fillStyle = synced ? "rgba(6, 214, 160, 0.3)" : "rgba(239, 71, 111, 0.3)"; // Green if synced, Red if not
    
    for (let i = 0; i <= windowW; i++) {
        const globalX = windowPos + i;
        const t = (globalX / 100);
        const val = (Math.sin(t * freq) + 1) / 2;
        const py = (1 - val) * waveH - waveH/2;
        
        if (i===0) {
            ctx.moveTo(startX + globalX, 0 + waveH/2); // Bottom left
            ctx.lineTo(startX + globalX, py); // Top left
        } else {
            ctx.lineTo(startX + globalX, py);
        }
        if (i === Math.floor(windowW)) {
            ctx.lineTo(startX + globalX, 0 + waveH/2); // Bottom right
        }
    }
    ctx.fill();
    
    // Draw brackets
    ctx.strokeStyle = COLORS.text;
    ctx.beginPath();
    ctx.moveTo(startX + windowPos, waveH/2 + 10);
    ctx.lineTo(startX + windowPos + windowW, waveH/2 + 10);
    ctx.stroke();
    
    // Label
    ctx.textAlign = "center";
    ctx.fillStyle = COLORS.text;
    ctx.font = "italic 18px 'Latin Modern Math'";
    ctx.fillText(synced ? "T = 1/f" : "T ≠ 1/f", startX + windowPos + windowW/2, waveH/2 + 30);
    
    // Result Accumulator Bucket
    const bucketX = waveW/2 + 50;
    const bucketY = 0;
    
    // Calculate actual area
    // Just simulation for visual
    let area = 0;
    if (synced) {
        area = 0.6; // Constant
    } else {
        // Area varies based on window position (phase)
        area = 0.4 + 0.3 * Math.sin(time * 3);
    }
    
    // Draw Bucket
    ctx.fillStyle = "#eee";
    ctx.fillRect(bucketX, bucketY - 50, 40, 100);
    ctx.strokeStyle = "#333";
    ctx.strokeRect(bucketX, bucketY - 50, 40, 100);
    
    // Fill Level
    const level = area * 100;
    ctx.fillStyle = synced ? COLORS.green : COLORS.red;
    ctx.fillRect(bucketX, bucketY + 50 - level, 40, level);
    
    ctx.fillStyle = "#333";
    ctx.fillText("Energy", bucketX + 20, bucketY + 70);

    ctx.restore();
}


// --- Main Render Loop ---

function render(timestamp) {
    if (!state.startTime) state.startTime = timestamp;
    const elapsed = (timestamp - state.startTime) / 1000;
    state.time = elapsed;

    // Clear Canvas
    ctx.clearRect(0, 0, width, height);
    drawGrid();

    // Update Subtitles
    const currentSub = script.find(s => elapsed >= s.start && elapsed < s.start + s.dur);
    const subEn = document.getElementById('sub-en');
    const subCn = document.getElementById('sub-cn');
    if (currentSub) {
        subEn.innerText = currentSub.en;
        subCn.innerText = currentSub.cn;
        document.getElementById('subtitle-box').style.opacity = 1;
    } else {
        document.getElementById('subtitle-box').style.opacity = 0;
    }

    // --- Scene Logic ---
    
    // Scene 1: Intro (0-4s)
    if (elapsed < 4) {
        ctx.save();
        ctx.translate(width/2, height/2);
        ctx.textAlign = "center";
        
        ctx.fillStyle = COLORS.text;
        ctx.font = "bold 60px 'Latin Modern Math'";
        ctx.globalAlpha = Math.min(1, elapsed);
        ctx.fillText("Camera Anti-Flicker", 0, -20);
        
        ctx.font = "30px 'Noto Sans SC'";
        ctx.fillStyle = COLORS.blue;
        ctx.fillText("相机抗频闪原理", 0, 40);
        ctx.restore();
    }
    
    // Scene 2: The AC Wave & The Problem (4s - 20s)
    else if (elapsed < 20) {
        const localTime = elapsed - 4;
        const fadeIn = clamp(localTime, 0, 1);
        
        ctx.save();
        ctx.globalAlpha = fadeIn;
        
        // Draw Light Source (Top)
        const waveX = width * 0.2;
        const waveY = height * 0.25;
        // Frequency speeds up to show 50Hz concept
        const freq = 2 + localTime * 0.1; 
        drawLightWave(waveX, waveY, width * 0.6, 60, freq, -localTime * 5);
        
        // Draw Phone Screen (Bottom)
        if (localTime > 5) {
            const phoneAlpha = clamp(localTime - 5, 0, 1);
            ctx.globalAlpha = phoneAlpha;
            const phoneW = 300;
            const phoneH = 400;
            const phoneX = width/2 - phoneW/2;
            const phoneY = height * 0.45;
            
            // Show banding!
            // Exposure time is short (0.1), causing banding
            drawSensorView(phoneX, phoneY, phoneW, phoneH, localTime, 0.1, true);
            
            ctx.fillStyle = COLORS.text;
            ctx.font = "24px 'Latin Modern Math'";
            ctx.textAlign = "center";
            ctx.fillText("Resulting Image", width/2, phoneY + phoneH + 40);
        }
        
        ctx.restore();
    }
    
    // Scene 3: The Mechanics (Rolling Shutter + Math) (20s - 38s)
    else if (elapsed < 38) {
        const localTime = elapsed - 20;
        
        // Split screen: Left (Physics), Right (Math)
        
        // Left: Rolling Shutter Diagram
        const phoneW = 200;
        const phoneH = 300;
        const phoneX = width * 0.25 - phoneW/2;
        const phoneY = height/2 - phoneH/2;
        
        drawSensorView(phoneX, phoneY, phoneW, phoneH, localTime, 0.05, true); // Short exposure
        
        // Arrow
        ctx.fillStyle = COLORS.text;
        ctx.font = "40px Arial";
        ctx.fillText("→", width/2 - 20, height/2);

        // Right: Integration Logic
        const mathX = width * 0.75;
        const mathY = height/2;
        
        // Draw the integration visualization
        // Not synced yet
        drawIntegralVis(mathX - 100, mathY, 100, localTime, 0.15, false); // 0.15 is random width not matching period
        
        // Text
        ctx.textAlign = "center";
        ctx.fillStyle = COLORS.red;
        ctx.font = "20px 'Latin Modern Math'";
        ctx.fillText("Variable Energy = Flicker", mathX, mathY + 120);
    }
    
    // Scene 4: The Solution (38s - End)
    else {
        const localTime = elapsed - 38;
        
        // Transition variable: 0 -> 1
        const fixProgress = clamp(localTime / 4, 0, 1);
        const easedFix = easeInOutCubic(fixProgress);
        
        // Exposure time changes from random (0.15) to period (0.25 assuming freq=4)
        // Freq is 4 in our visual, so Period T = 1/4 = 0.25
        const currentExposure = lerp(0.15, 0.25, easedFix);
        const isSynced = fixProgress > 0.9;
        
        // Center Layout
        const phoneW = 250;
        const phoneH = 350;
        const phoneX = width * 0.2 - phoneW/2;
        const phoneY = height/2 - phoneH/2;
        
        drawSensorView(phoneX, phoneY, phoneW, phoneH, localTime, currentExposure, true);
        
        // Math Visual
        const mathX = width * 0.6;
        const mathY = height/2;
        drawIntegralVis(mathX, mathY, 100, localTime, currentExposure, isSynced);
        
        // Big Label
        if (isSynced) {
            ctx.save();
            ctx.textAlign = "center";
            ctx.fillStyle = COLORS.green;
            ctx.font = "bold 40px 'Latin Modern Math'";
            ctx.shadowColor = "rgba(0,0,0,0.2)";
            ctx.shadowBlur = 10;
            ctx.fillText("Anti-Banding: ON", width/2, height * 0.15);
            ctx.font = "20px 'Noto Sans SC'";
            ctx.fillText("Exposure = n × Light Period", width/2, height * 0.22);
            ctx.restore();
        }
    }

    // End loop
    if (elapsed < 60) {
        requestAnimationFrame(render);
    } else {
        // Show replay button or stop
    }
}

// Start
requestAnimationFrame(render);

</script>
</body>
</html>
